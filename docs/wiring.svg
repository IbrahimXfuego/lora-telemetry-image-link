<text x="65" y="965" class="small">Radio stays deselected at boot; GPIO12 must not be driven HIGH.</text>
<text x="65" y="994" class="small">RESET is held HIGH; no MCU-controlled radio reset on remote.</text>
<text x="65" y="1023" class="small">Use these passives with the supplied pin mapping.</text>
<rect x="765" y="695" width="700" height="355" rx="10" class="panel"/>
<text x="781" y="726" class="head">SENSOR &amp; RADIO POWER</text>
<text x="795" y="756" class="label">DHT11 VCC → 3.3 V; GND → remote GND.</text>
<text x="795" y="792" class="label">DATA → GPIO3 with 4.7–10 kΩ pull-up if absent.</text>
<text x="795" y="828" class="label">Disconnect DHT DATA during ESP32-CAM upload.</text>
<text x="795" y="878" class="label">Ra-02 uses 3.3 V power and 3.3 V logic only.</text>
<text x="795" y="914" class="label">Fit local decoupling and use adequate regulator headroom.</text>
<text x="795" y="950" class="label">Attach a matched antenna to each radio before TX.</text>
<text x="795" y="1000" class="small">No microSD card; DIO0 is not required in polling mode.</text>
<rect x="35" y="1075" width="1430" height="180" rx="10" class="panel"/>
<text x="51" y="1106" class="head">POWER AND CONNECTION NOTES</text>
<text x="60" y="1137" class="label">No separate USB-to-TTL adapter is used between the ground NodeMCU and laptop.</text>
<text x="60" y="1173" class="label">Grounds connect within each assembly; no ground wire is needed across the wireless link.</text>
<text x="60" y="1209" class="label">Do not connect 5 V to Ra-02. Do not parallel independent supply outputs. Use only regulated adapter DC outputs.</text>
<text x="40" y="1294" class="small">See docs/WIRING.md for all connections. See the pin tables for firmware connections.</text>
</svg>